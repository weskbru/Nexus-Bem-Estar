services:
  redis:
    image: redis:7-alpine
    container_name: sis_bem_estar_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sis_bem_estar_backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:?configure DB_NAME do banco externo}
      DB_USER: ${DB_USER:?configure DB_USER do banco externo}
      DB_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD do banco externo}
      DB_HOST: ${DB_HOST:?configure DB_HOST do banco externo}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             python manage.py criar_admin &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 1 --timeout 60 --max-requests 300 --max-requests-jitter 50 --access-logfile - --error-logfile -"

  comunicados_scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sis_bem_estar_comunicados_scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_NAME: ${DB_NAME:?configure DB_NAME do banco externo}
      DB_USER: ${DB_USER:?configure DB_USER do banco externo}
      DB_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD do banco externo}
      DB_HOST: ${DB_HOST:?configure DB_HOST do banco externo}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    command: >
      sh -c "sleep 15;
             while true; do
               python manage.py enviar_comunicados_agendados || true;
               python manage.py enviar_emails_eventos_agendados || true;
               sleep 60;
             done"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: sis_bem_estar_frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"
    depends_on:
      - backend
