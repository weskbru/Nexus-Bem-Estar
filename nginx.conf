server {
    listen 80;

    # Limite do corpo da requisição — necessário para comunicados com imagens base64
    client_max_body_size 20M;

    # ── Frontend (build estático do React) ───────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # Necessário para React Router (SPA): redireciona tudo para index.html
        try_files $uri $uri/ /index.html;
    }

    # ── API Django (proxy para o backend) ────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
