services:

  # ─── Banco de dados ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sis_bem_estar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sis_bem_estar}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sis_bem_estar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache (Redis) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sis_bem_estar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ─── Backend (Django) ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sis_bem_estar_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             python manage.py criar_admin &&
             gunicorn backend.core.wsgi:application --bind 0.0.0.0:8000 --workers 9 --threads 4 --timeout 60 --reload"

  # ─── Frontend (Vite + React) ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sis_bem_estar_frontend
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "150"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm install --legacy-peer-deps && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
