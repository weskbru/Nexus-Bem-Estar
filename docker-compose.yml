services:

  # ─── Banco de dados ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sis_bem_estar_db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME:-sis_bem_estar}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sis_bem_estar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache (Redis) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sis_bem_estar_redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "6379:6379"

  # ─── Backend (Django) ─────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sis_bem_estar_backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             python manage.py criar_admin &&
             gunicorn backend.core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --reload"

  # ─── Frontend (Vite + React) ──────────────────────────────────────────────
  comunicados_scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sis_bem_estar_comunicados_scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
    command: >
      sh -c "sleep 15;
             while true; do
               python manage.py enviar_comunicados_agendados || true;
               python manage.py enviar_emails_eventos_agendados || true;
               sleep 60;
             done"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: sis_bem_estar_frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "150"
    ports:
      - "3000:3000"
    volumes:
      # Monta apenas o código-fonte para hot reload.
      # O node_modules fica dentro da imagem (instalado no build),
      # evitando conflito e tornando o startup imediato.
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  postgres_data:
